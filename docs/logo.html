<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>s9y Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f6fa;
            font-family: system-ui, sans-serif;
        }

        .logo-wrapper {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        canvas {
            display: block;
            width: 500px;
            height: 580px;
            border-radius: 12px;
            background: #ffffff;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-group button {
            padding: 8px 20px;
            border: 1px solid #ccc;
            border-radius: 30px;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
        }

        .btn-group button:hover {
            background: #eee;
        }

        .btn-group button.active-btn {
            background: #1a1a2e;
            color: #fff;
            border-color: #1a1a2e;
        }

        @media (max-width: 600px) {
            .logo-wrapper {
                padding: 16px;
                border-radius: 12px;
            }

            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 500 / 580;
            }
        }
    </style>
</head>

<body>
    <div class="logo-wrapper">
        <canvas id="logoCanvas" width="500" height="580"></canvas>
        <div class="btn-group">
            <button id="btnTheme" onclick="switchTheme()">明暗主题</button>
        </div>
    </div>

    <script>
        const lu = new URL(location.href);
        const sp = lu.searchParams;
        const config = {
            // ----- 尺寸参数 -----
            W: 500,
            H: 580,
            R: 80,
            r: 10,
            LINE_WIDTH: 4,
            init() {
                this.GAP = -this.r;
                this.D = this.R + this.r + this.GAP;

                this.cy_mid = this.cy_top + this.cy_step;
                this.cy_bot = this.cy_mid + this.cy_step * this.cy_bot_ratio;
            },
            GAP: -4,
            D: 80,
            // 三个大圆圆心 (垂直居中)
            cx: 250,
            cy_step: 160,
            cy_top: 130,
            // 往上抬的比例系数 1-0.666=33.4%  
            cy_bot_ratio: 0.666,
            cy_mid: 290,
            cy_bot: 0.666,

            // 辅助线
            dash: false,
            darkness: sp.get('d') == 'true',
            // 白色填充
            fill: true,
            REG_COLOR: '#f0883e',
            PUSH_COLOR: '#58a6ff',
            RING_COLOR: '#1a1a2e',
            DEF_FILL_COLOR: '#fff',
            DOT_STROKE_COLOR: '#000',
            CORE_COLOR: '#000',
            // 全局旋转角度
            rotateDeg: -25,
        };
        config.init();
        if (config.darkness) {
            config.DEF_FILL_COLOR = '#000';
            config.CORE_COLOR = '#fff';
            // #1a1a2e 在暗色时的反转色
            config.RING_COLOR = '#e5e5d1';
            config.DOT_STROKE_COLOR = '#fff';
        }
        function switchTheme() {
            lu.searchParams.set('d', config.darkness == false);
            location.href = lu.href;
        }

        function showBase(mode) {
            const canvas = document.getElementById('logoCanvas');
            const ctx = canvas.getContext('2d');
            const W = 500, H = 580, CX = 250, R = 80, r = 8, LINE_W = 4.5;
            const CY_T = 130, CY_M = CY_T + 160, CY_B = CY_M + 160, D = R + 6;

            // ----- 工具函数 -----
            function deg(deg) {
                return deg * Math.PI / 180;
            }

            // ----- 绘制边 -----
            function drawBigEdgeArc(cx, cy, startDeg, endDeg, clockwise, color) {
                ctx.beginPath();
                ctx.arc(cx, cy, config.R * 2, deg(startDeg), deg(endDeg), !clockwise);
                ctx.strokeStyle = color || config.RING_COLOR;
                ctx.lineWidth = config.LINE_WIDTH;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            // ----- 绘制大圆 (部分) -----
            function drawBigArc(cx, cy, startDeg, endDeg, clockwise, color) {
                ctx.beginPath();
                ctx.arc(cx, cy, config.R, deg(startDeg), deg(endDeg), !clockwise);
                ctx.strokeStyle = color || config.DOT_STROKE_COLOR;
                ctx.lineWidth = config.LINE_WIDTH;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
            // 绘制虚线
            function drawBigArcDash(cx, cy, startDeg, endDeg, clockwise) {
                ctx.setLineDash([5, 5]);          // 虚线：线段长5px，间隔5px
                ctx.beginPath();
                ctx.arc(cx, cy, config.R, deg(startDeg), deg(endDeg), !clockwise);
                ctx.strokeStyle = config.RING_COLOR;
                ctx.lineWidth = config.LINE_WIDTH / 2;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // ----- 绘制小圆 (擦除底色 + 描边) -----
            function drawDot(cx, cy, color) {
                // 1. 擦除圆点区域内的所有已有内容
                ctx.save();
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(cx, cy, config.r, 0, deg(360));
                ctx.fill();
                ctx.restore();

                // 2. 再画圆点边框
                ctx.beginPath();
                ctx.arc(cx, cy, config.r, 0, deg(360));
                if (config.fill) {
                    // 填充白色
                    ctx.fillStyle = config.DEF_FILL_COLOR;
                    ctx.fill();
                }
                // 描边
                ctx.strokeStyle = color || config.DOT_STROKE_COLOR;
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }
            function drawDot2(cx, cy, color) {
                // 1. 擦除圆点区域内的所有已有内容
                ctx.save();
                // 2. 再画圆点边框
                ctx.beginPath();
                ctx.arc(cx, cy, config.r / 4, 0, deg(360));
                if (config.fill) {
                    // 填充白色
                    ctx.fillStyle = config.DEF_FILL_COLOR;
                    ctx.fill();
                }
                // 描边
                ctx.strokeStyle = color || config.DOT_STROKE_COLOR;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }

            // ----- 绘制竖线 (连接中、下大圆) -----
            function drawConnector(color) {
                const x = config.cx + config.R;
                ctx.beginPath();
                ctx.moveTo(x, config.cy_mid);
                ctx.lineTo(x, config.cy_bot);
                ctx.strokeStyle = color || config.RING_COLOR;
                ctx.lineWidth = config.LINE_WIDTH;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            function drawCore(cx, cy) {
                const degNum = 25;

                // 2. register原语 (橙色半环从左到右进入中心)
                ctx.beginPath();
                ctx.arc(cx, cy, R * 0.6, deg(195 + degNum), deg(345 + degNum), false);
                ctx.strokeStyle = config.REG_COLOR;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.stroke();

                // 3. push原语 (蓝色半环从右向左进入中心，互锁)
                ctx.beginPath();
                ctx.arc(cx, cy, R * 0.6, deg(15 + degNum), deg(165 + degNum), false);
                ctx.strokeStyle = config.PUSH_COLOR;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.stroke();

                // 4. 中心奇点白点 (最小完备性的承载)
                ctx.beginPath();
                ctx.arc(cx, cy, 20, 0, Math.PI * 2);
                ctx.fillStyle = config.CORE_COLOR;
                ctx.fill();
            }
            function modeDraw(currentMode) {

                // --- 清空画布 ---
                ctx.clearRect(0, 0, config.W, config.H);
                if (config.fill) {
                    ctx.fillStyle = config.DEF_FILL_COLOR;
                    ctx.fillRect(0, 0, config.W, config.H);
                }

                const cx = config.cx;
                const cyT = config.cy_top;
                const cyM = config.cy_mid;
                const cyB = config.cy_bot;
                const D = config.D;
                // 角度常量（方便阅读）
                const A0 = 0,
                    A90 = 90,
                    A180 = 180,
                    A270 = 270,
                    A360 = 360;
                // 中间小圆角度
                const angle = deg(180);

                // 画面整体旋转
                const cy = config.cy_mid;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(deg(config.rotateDeg));
                ctx.translate(-cx, -cy);

                drawCore(cx, cyM);

                drawBigEdgeArc(cx, config.cy_top + config.cy_step * 1.5, A270, A360, true, config.REG_COLOR);
                drawBigEdgeArc(cx, config.cy_top + config.cy_step * 0.5, A90, A180, true, config.PUSH_COLOR);
                // drawDot(cx + D * 0.6, config.cy_top + config.cy_step, config.REG_COLOR);
                // drawDot(cx - D * 0.6, config.cy_top + config.cy_step, config.PUSH_COLOR);
                drawDot(cx - D * 0.45, config.cy_top + config.cy_step * 0.8, config.REG_COLOR);
                drawDot(cx + D * 0.45, config.cy_top + config.cy_step * 1.2, config.PUSH_COLOR);
                drawDot2(cx, cyM, '#000');

                // 大圆
                drawBigArc(cx, cyM, A0, A360, true);
            }
            modeDraw(mode);
        }

        window.onload = showBase;
    </script>
</body>

</html>
